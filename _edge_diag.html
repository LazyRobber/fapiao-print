<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>edge diag</title></head>
<body><pre id="out">running...</pre>
<script type="module">
const lines = [];
function P() {
  lines.push(Array.from(arguments).map(a => (a && typeof a === 'object') ? JSON.stringify(a) : String(a)).join(' '));
  document.getElementById('out').textContent = lines.join('\n');
  fetch('/result', { method: 'POST', body: lines.join('\n') }).catch(function() {});
}
window.addEventListener('error', e => P('ONERROR: ' + e.message));

const W = 2480, H = 3507;
const BODY = { x: 400, y: 900, w: 1600, h: 1400 };   // 主体放中间，上下留大空白

// 与 trimOneImage 同逻辑，阈值/最少像素参数化
function detect(dataUrl, thr, minCount) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = function () {
      const cv = document.createElement('canvas');
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
      const cw = cv.width, ch = cv.height;
      function rowHas(y) { let n = 0; for (let x = 0; x < cw; x++) { const i = (y*cw+x)*4; if (d[i]<thr||d[i+1]<thr||d[i+2]<thr) { if (++n >= minCount) return true; } } return false; }
      function colHas(x) { let n = 0; for (let y = 0; y < ch; y++) { const i = (y*cw+x)*4; if (d[i]<thr||d[i+1]<thr||d[i+2]<thr) { if (++n >= minCount) return true; } } return false; }
      let top = 0; while (top < ch && !rowHas(top)) top++;
      let bottom = ch - 1; while (bottom > top && !rowHas(bottom)) bottom--;
      let left = 0; while (left < cw && !colHas(left)) left++;
      let right = cw - 1; while (right > left && !colHas(right)) right--;
      resolve({ left, top, right, bottom, w: cw, h: ch });
    };
    img.src = dataUrl;
  });
}

function build(opts) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { alpha: false });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(BODY.x, BODY.y, BODY.w, BODY.h);
  if (opts.edgeLineGray != null) {
    // 页面上下各一条浅灰横线（模拟渲染边缘线/页眉页脚分隔线）
    ctx.fillStyle = 'rgb(' + opts.edgeLineGray + ',' + opts.edgeLineGray + ',' + opts.edgeLineGray + ')';
    ctx.fillRect(300, 300, 1900, 2);
    ctx.fillRect(300, 3200, 1900, 2);
  }
  return cv.toDataURL('image/jpeg', 0.92);
}

function show(tag, r) {
  return tag + ' → 上白边=' + r.top + ' 下白边=' + (r.h - 1 - r.bottom)
    + ' 左=' + r.left + ' 右=' + (r.w - 1 - r.right);
}

// 期望：只有主体时，上下白边应≈900/1907；若被边缘线顶住则≈300/305
try {
  const ref = await detect(build({}), 252, 2);
  P('[基准 无边缘元素] ' + show('thr252', ref) + '  （期望上≈896 下≈1903）');

  P('');
  P('[A] 页面上下各一条 2px 浅灰横线，看阈值对上下白边的影响');
  for (const g of [240, 248, 250, 251, 252]) {
    const url = build({ edgeLineGray: g });
    const r252 = await detect(url, 252, 2);
    const r245 = await detect(url, 245, 2);
    P('  线灰度 ' + g + ' | ' + show('旧245', r245));
    P('  ' + ' '.repeat(String(g).length + 4) + '| ' + show('新252', r252));
  }

  P('');
  P('[B] 参考：页面上下各一段浅灰细字（高30px，灰度250）——这种应该被保留');
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { alpha: false });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(BODY.x, BODY.y, BODY.w, BODY.h);
  ctx.fillStyle = 'rgb(250,250,250)';
  ctx.font = '33px sans-serif';
  ctx.fillText('下载次数：1', 1800, 340);
  ctx.fillText('第 1 页', 1800, 3400);
  const rb = await detect(cv.toDataURL('image/jpeg', 0.92), 252, 2);
  P('  ' + show('thr252', rb) + '  （期望上≈300 下≈307，即保住浅灰细字）');

  P('DONE');
} catch (e) {
  P('ERROR ' + (e && (e.stack || e.message || String(e))));
}
</script>
</body></html>
